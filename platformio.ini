; ============================================================================
;  Datei:   platformio.ini
;  Projekt: SE Testkoffer – Steuerung (Grundaufbau) V55
; ============================================================================
;  Rolle im Gesamtsystem
;  ---------------------------------------------------------------------------
;  Diese Datei legt fest, für welche Hardware das Programm übersetzt wird,
;  welche Bibliotheken PlatformIO automatisch herunterlädt und wie die
;  Display-Bibliothek TFT_eSPI konfiguriert ist.
;
;  Wichtige Hinweise
;  ---------------------------------------------------------------------------
;  - Board: Wemos/LOLIN D32 (ESP32). Plattform espressif32 Version 6.x
;    (Arduino-Core 2.0.x). Version 7 wird bewusst ausgeschlossen, weil
;    TFT_eSPI mit dem neueren Arduino-Core 3.x nicht zuverlässig läuft.
;  - TFT_eSPI wird NICHT über die Datei User_Setup.h in der Bibliothek
;    konfiguriert, sondern vollständig über die build_flags unten
;    (USER_SETUP_LOADED). Dadurch bleibt die Konfiguration im Projekt und
;    geht bei einer Aktualisierung der Bibliothek nicht verloren.
;  - Die Display-Pins entsprechen dem Schema «SE Testkoffer – Steuerung V2»
;    (Stecker LCD1, Flachbandkabel zum Joy-IT RB-TFT3.2-V3).
; ============================================================================

[env:lolin_d32]
platform      = espressif32@^6.5.0
board         = lolin_d32
framework     = arduino

monitor_speed   = 115200
monitor_filters = printable
upload_speed    = 921600

lib_deps =
  bodmer/TFT_eSPI@^2.5.43

build_flags =
  ; --- TFT_eSPI: Konfiguration aus dem Projekt verwenden -------------------
  -D USER_SETUP_LOADED=1
  ; Display-Controller (aus der Firmware des Prototyps bestimmt: ILI9341)
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  ; --- SPI-Bus Display + Touch (Schema V2) ----------------------------------
  -D TFT_MOSI=23          ; IO23  LCD_SPI_Mosi  -> Display Pin 19
  -D TFT_MISO=19          ; IO19  LCD_SPI_Miso  -> Display Pin 21
  -D TFT_SCLK=18          ; IO18  LCD_SPI_Sck   -> Display Pin 23
  -D TFT_CS=5             ; IO5   LCD_SPI_Ce0   -> Display Pin 24 (CS Display)
  -D TFT_DC=16            ; IO16  LCD_Dc        -> Display Pin 15
  -D TFT_RST=4            ; IO4   LCD_Rst       -> Display Pin 13
  -D TOUCH_CS=17          ; IO17  LCD_SPI_Ce1   -> Display Pin 26 (CS Touch XPT2046)
  ; --- Schriften (nur die tatsächlich verwendeten) --------------------------
  -D LOAD_GLCD=1          ; Font 1 (klein, für Hinweise)
  -D LOAD_FONT2=1         ; Font 2 (16 px)
  -D LOAD_FONT4=1         ; Font 4 (26 px)
  ; --- Taktraten -------------------------------------------------------------
  ; 20 MHz ist für das 20 cm lange Flachbandkabel ein sicherer Wert.
  -D SPI_FREQUENCY=20000000
  -D SPI_READ_FREQUENCY=10000000
  ; Der Touch-Controller XPT2046 verträgt höchstens 2,5 MHz.
  -D SPI_TOUCH_FREQUENCY=2500000
